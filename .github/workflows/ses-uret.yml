name: Seslendirme (Google TTS)

# İçerik değişince eksik sesleri üretir ve depoya ekler. GOOGLE_TTS_API_KEY
# tanımlı değilse hiçbir şey yapmadan başarıyla biter (uygulama cihaz sesini kullanır).

on:
  push:
    branches: [main, oyun-demirdag]
    paths: ["assets/content/**", "tools/audio/**", ".github/workflows/ses-uret.yml"]
  workflow_dispatch:

concurrency:
  group: ses
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Anahtar var mı?
        id: key
        env:
          K: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -z "$K" ]; then
            echo "::notice::GOOGLE_TTS_API_KEY tanımlı değil; seslendirme atlandı."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Eksik sesleri üret
        if: steps.key.outputs.ok == 'true'
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python3 tools/audio/speech.py synthesize
      - name: Depoya ekle
        # Üretim yarıda kalsa da üretilenler eklenir; yeniden çalışınca kalanlar üretilir
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          python3 tools/audio/speech.py pack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio assets/audio_ui tools/audio/texts.json
          if git commit -qm "Seslendirme: eksik sesler üretildi"; then
            git push
            echo "yeni=1" >> "$GITHUB_ENV"
          else
            echo "Yeni ses yok."
          fi
      - name: Sınıf ses paketlerini yayımla (GitHub Releases, etiket "ses")
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/audio/speech.py pack
          gh release view ses >/dev/null 2>&1 || gh release create ses \
            --title "Ses paketleri" --latest=false --target "${GITHUB_REF_NAME}" \
            --notes "Uygulama çocuğun sınıfının ses paketini buradan bir kez indirir (lib/app/audio_packs.dart). Elle değiştirmeyin; Seslendirme iş akışı günceller."
          gh release upload ses dist/* --clobber
      - name: Uygulamayı yeniden derle
        if: env.yeni == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run web.yml --ref "${GITHUB_REF_NAME}"
