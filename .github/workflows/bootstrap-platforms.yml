name: Platform klasörlerini oluştur (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: flutter create
        run: |
          flutter create --platforms=android,ios --org com.derskumbarasi --project-name ders_kumbarasi .
          # flutter create varsayılan test dosyası ekler; projede kendi testlerimiz var
          rm -f test/widget_test.dart
      - name: Değişiklikleri gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Android ve iOS platform klasörleri (flutter create)" || echo "Değişiklik yok"
          git push
