name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG: com.derskumbarasi

permissions:
  contents: write

jobs:
  analyze-test:
    name: Analiz + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
            rm -f test/widget_test.dart
          fi
      - name: İçerik paketlerini ve emoji görsellerini doğrula
        run: |
          python3 tools/content/build.py --check
          pip install --quiet regex
          python3 tools/emoji/fetch.py --check
      - run: flutter pub get
      - name: Biçimlendir (otomatik düzeltilir)
        run: dart format lib test
      - name: Biçim ve pubspec.lock değişikliklerini gönder
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain lib test pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test pubspec.lock
            git commit -m "dart format / pubspec.lock (otomatik)"
            git push
          fi
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Yayın anahtarı (varsa)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Yayın anahtarıyla imzalanacak."
          else
            echo "ANDROID_KEYSTORE_BASE64 yok: hata ayıklama anahtarıyla imzalanır (yalnızca deneme)."
          fi
      - name: APK ve App Bundle (AAB)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: ders-kumbarasi-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: iOS (imzasız)
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Paketle
        run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ders-kumbarasi-ios-unsigned
          path: Runner-unsigned.zip
          retention-days: 14
