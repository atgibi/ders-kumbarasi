name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG: com.derskumbarasi

jobs:
  analyze-test:
    name: Analiz + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
          fi
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ders-kumbarasi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS (imzasız)
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Eksik platform klasörlerini oluştur
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=android,ios --org "$ORG" --project-name ders_kumbarasi .
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Paketle
        run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ders-kumbarasi-ios-unsigned
          path: Runner-unsigned.zip
          retention-days: 14
