name: Web önizleme ve ekran görüntüleri

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Web platformu
        run: |
          flutter create . --platforms web --org com.derskumbarasi --project-name ders_kumbarasi
          rm -f test/widget_test.dart
          sed -i 's|<title>.*</title>|<title>Bilgelik Diyarı</title>|' web/index.html
          sed -i 's|"name": ".*"|"name": "Bilgelik Diyarı"|; s|"short_name": ".*"|"short_name": "Bilgelik Diyarı"|' web/manifest.json
          for f in web/favicon.png web/icons/Icon-192.png web/icons/Icon-512.png web/icons/Icon-maskable-192.png web/icons/Icon-maskable-512.png; do
            cp assets/mascot/icon_512.png "$f"
          done
      - run: flutter pub get
      - name: Web derlemesi
        run: |
          flutter build web --release --base-href /ders-kumbarasi/
          # Mağaza kayıtları için gizlilik politikası adresi: .../ders-kumbarasi/gizlilik.html
          cp docs/gizlilik.html build/web/gizlilik.html

      - name: Ekran görüntüleri
        continue-on-error: true
        run: |
          mkdir -p site/ders-kumbarasi shots
          cp -r build/web/* site/ders-kumbarasi/
          (cd site && python3 -m http.server 8080 > /dev/null 2>&1 &)
          npm init -y > /dev/null
          npm install --silent playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node tools/screenshots.mjs http://localhost:8080/ders-kumbarasi/ shots

      - name: Ekran görüntülerini "ekran" dalına gönder
        continue-on-error: true
        run: |
          ls shots
          cd shots
          git init -q -b ekran
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Ekran görüntüleri ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ekran

      - name: GitHub Pages ayarı
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success' && github.ref == 'refs/heads/main'
        with:
          path: build/web
      - name: Yayımla
        if: steps.pages.outcome == 'success' && github.ref == 'refs/heads/main'
        id: deploy
        uses: actions/deploy-pages@v4
