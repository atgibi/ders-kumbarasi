name: ders_kumbarasi
description: "Bilgelik Diyarı — Türkiye Yüzyılı Maarif Modeli'ne uygun, tekrar ederek öğrenme uygulaması (ilkokul 1-4. sınıf)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.0
  flutter_tts: ^4.0.0
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.0
  shared_preferences: ^2.2.0
  share_plus: ^10.1.4
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/content/
    - assets/mascot/
    - assets/audio/
    - assets/emoji/
    - assets/fonts/licenses/
    - assets/ikon/
  fonts:
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-400.ttf
          weight: 400
        - asset: assets/fonts/Andika-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-800.ttf
          weight: 800
    - family: Shantell
      fonts:
        - asset: assets/fonts/ShantellSans-500.ttf
          weight: 500
        - asset: assets/fonts/ShantellSans-700.ttf
          weight: 700
