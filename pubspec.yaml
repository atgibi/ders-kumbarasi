name: ders_kumbarasi
description: "Ders Kumbarası — Türkiye Yüzyılı Maarif Modeli'ne uygun, tekrar ederek öğrenme uygulaması (ilkokul 1-4. sınıf)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.0
  flutter_tts: ^4.0.0
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/content/
    - assets/mascot/
    - assets/audio/
